# jgs-sysmlv2-api-mcp is a LOCAL stdio MCP server that talks to the user's
# own SysML v2 API endpoint. It cannot be Smithery-hosted; this manifest is
# the local-launch descriptor.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [SYSMLV2_BASE_URL, SYSMLV2_TOKEN, SYSMLV2_PROJECT]
    properties:
      SYSMLV2_BASE_URL:
        type: string
        description: SysML v2 API endpoint (HTTPS, or http:// for loopback only)
      SYSMLV2_TOKEN:
        type: string
        description: Bearer token (required; on an open local pilot any non-empty placeholder works)
      SYSMLV2_PROJECT:
        type: string
        description: Project UUID the write buffer binds to
  commandFunction: |-
    (config) => ({
      command: "jgs-sysmlv2-api-mcp.exe",
      env: config
    })
